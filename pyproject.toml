[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-opt"
version = "0.1.0"
description = "Automated in-layer geometry optimization for organic semiconductor crystals"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["molecular-crystal", "organic-semiconductor", "amber", "gaussian", "dft"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]
viz = [
  "streamlit>=1.35",
  "plotly>=5.0",
  "py3Dmol>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

