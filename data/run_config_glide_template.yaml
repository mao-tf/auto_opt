# run_config.yaml  ―  auto_opt パイプライン設定（glide / 映進対称）
#
# 使い方:
#   python -m auto_opt.run --config このファイル
#   python -m auto_opt.run --config このファイル --stop-after vdw   # VdW だけ
#   python -m auto_opt.run --config このファイル --start-from amber  # Amber から再開

# ── 基本設定 ──────────────────────────────────────────────────────────
monomer: DNTT                          # モノマー名（data/monomer/ にある名前）
symmetry: glide                        # glide / screw
auto_dir: runs/DNTT_glide             # 出力ディレクトリ（実行時に自動作成）

# monomer_path は省略可。省略時は data/monomer/{monomer}.xyz を使用。
# monomer_path: data/monomer/DNTT.xyz

# ── スウィープパラメータ ───────────────────────────────────────────────
parameters:
  z:
    min: 0.0
    max: 3.0
    step: 0.5

  alpha:
    min: 60
    max: 70
    step: 5

  phi:
    min: -10
    max: 10
    step: 5

  # glide VdW スウィープの接触方向角（theta_c）の刻み幅
  theta_c_step: 5

# ── Amber 最適化 ───────────────────────────────────────────────────────
amber:
  num_nodes: 38                        # 並列ノード数（スパコンの空き状況に合わせる）
