# run_config.yaml  ―  auto_opt パイプライン設定（screw / 螺旋軸対称）
#
# 使い方:
#   python -m auto_opt.run --config このファイル
#   python -m auto_opt.run --config このファイル --stop-after vdw
#   python -m auto_opt.run --config このファイル --start-from amber

# ── 基本設定 ──────────────────────────────────────────────────────────
monomer: DNTT
symmetry: screw
auto_dir: runs/DNTT_screw

# ── スウィープパラメータ ───────────────────────────────────────────────
parameters:
  z:
    min: 0.0
    max: 3.0
    step: 0.5

  alpha:
    min: 60
    max: 70
    step: 5

  beta:                                # x 軸まわりの傾き角（screw のみ）
    min: 0
    max: 10
    step: 5

  phi:
    min: -10
    max: 10
    step: 5

# VdW スウィープで出力する構造タイプ: all / a-stack / b-stack
vdw_select: all

# ── Amber 最適化 ───────────────────────────────────────────────────────
amber:
  num_nodes: 38
